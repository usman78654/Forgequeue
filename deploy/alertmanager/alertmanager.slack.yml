global:
  resolve_timeout: 5m

route:
  receiver: slack
  group_by: [alertname, severity]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: slack
    slack_configs:
      - api_url_file: /run/secrets/slack_webhook_url
        channel: "#forgequeue-alerts"
        send_resolved: true
        title: '{{ .Status | toUpper }} · {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }}
          Severity: {{ .Labels.severity }}
          {{ end }}
