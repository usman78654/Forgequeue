global:
  resolve_timeout: 5m

route:
  receiver: local-log
  group_by: [alertname, severity]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: local-log

# Local development intentionally has no external receiver. To enable Slack,
# use compose.slack.yaml and keep the webhook in a local secret file.
