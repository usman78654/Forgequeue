apiVersion: batch/v1
kind: Job
metadata: {name: forgequeue-migrate, namespace: forgequeue}
spec:
  backoffLimit: 4
  template:
    metadata: {labels: {app: forgequeue-migrate}}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ghcr.io/usman78654/forgequeue-migrate:latest
          envFrom: [{secretRef: {name: forgequeue-secrets}}]
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 200m, memory: 128Mi}}
