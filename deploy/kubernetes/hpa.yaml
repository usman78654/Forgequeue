apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata: {name: rabbitmq-auth, namespace: forgequeue}
spec:
  secretTargetRef:
    - {parameter: host, name: forgequeue-secrets, key: RABBITMQ_URL}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: {name: worker, namespace: forgequeue}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: worker}
  minReplicas: 2
  maxReplicas: 20
  pollingInterval: 10
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
  triggers:
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: jobs.default
        mode: QueueLength
        value: "20"
        activationValue: "1"
      authenticationRef: {name: rabbitmq-auth}
