apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: forgequeue}
spec:
  replicas: 2
  selector: {matchLabels: {app: forgequeue-api}}
  template:
    metadata: {labels: {app: forgequeue-api}}
    spec:
      containers:
        - name: api
          image: ghcr.io/usman78654/forgequeue-api:latest
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{secretRef: {name: forgequeue-secrets}}, {configMapRef: {name: forgequeue-config}}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: forgequeue}
spec:
  selector: {app: forgequeue-api}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: forgequeue}
spec:
  replicas: 3
  selector: {matchLabels: {app: forgequeue-worker}}
  template:
    metadata: {labels: {app: forgequeue-worker}}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ghcr.io/usman78654/forgequeue-worker:latest
          ports: [{name: metrics, containerPort: 9091}]
          envFrom: [{secretRef: {name: forgequeue-secrets}}, {configMapRef: {name: forgequeue-config}}]
          resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {cpu: "1", memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: worker-metrics, namespace: forgequeue}
spec:
  selector: {app: forgequeue-worker}
  ports: [{name: metrics, port: 9091, targetPort: metrics}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: scheduler, namespace: forgequeue}
spec:
  replicas: 2
  selector: {matchLabels: {app: forgequeue-scheduler}}
  template:
    metadata: {labels: {app: forgequeue-scheduler}}
    spec:
      containers:
        - name: scheduler
          image: ghcr.io/usman78654/forgequeue-scheduler:latest
          ports: [{name: metrics, containerPort: 9092}]
          env:
            - {name: WORKER_METRICS_ADDR, value: ":9092"}
          envFrom: [{secretRef: {name: forgequeue-secrets}}, {configMapRef: {name: forgequeue-config}}]
          resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: 250m, memory: 128Mi}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: api, namespace: forgequeue}
spec: {minAvailable: 1, selector: {matchLabels: {app: forgequeue-api}}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: worker, namespace: forgequeue}
spec: {minAvailable: 1, selector: {matchLabels: {app: forgequeue-worker}}}
