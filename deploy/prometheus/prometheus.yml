global:
  scrape_interval: 10s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: forgequeue-api
    static_configs:
      - targets: ["api:8080"]
  - job_name: forgequeue-worker
    static_configs:
      - targets: ["worker:9091"]
  - job_name: forgequeue-scheduler
    static_configs:
      - targets: ["scheduler:9092"]
