name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://queue:queue@localhost:5432/queue?sslmode=disable
      TEST_DATABASE_URL: postgres://queue:queue@localhost:5432/queue?sslmode=disable
      TEST_RABBIT_URL: amqp://guest:guest@localhost:5672/
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: queue, POSTGRES_PASSWORD: queue, POSTGRES_DB: queue}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U queue -d queue"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:4-alpine
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.x', cache: true}
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - run: go run ./cmd/migrate
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build ./cmd/...
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - uses: aquasecurity/trivy-action@0.28.0
        with: {scan-type: fs, scan-ref: ., severity: HIGH,CRITICAL, exit-code: '1'}

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker, scheduler, migrate, queuectl, loadtest]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: TARGET=${{ matrix.target }}
