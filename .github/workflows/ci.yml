name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://queue:queue@localhost:5432/queue?sslmode=disable
      TEST_DATABASE_URL: postgres://queue:queue@localhost:5432/queue?sslmode=disable
      TEST_RABBIT_URL: amqp://guest:guest@localhost:5672/
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: queue, POSTGRES_PASSWORD: queue, POSTGRES_DB: queue}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U queue -d queue"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:4-alpine
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.23.x', cache: true}
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - run: go run ./cmd/migrate -seed-development
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Enforce coverage threshold
        shell: bash
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          awk -v total="$total" 'BEGIN { if (total < 5) { printf "coverage %.1f%% is below 5%%\n", total; exit 1 } }'
      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
      - run: go build ./cmd/...
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run bundle:check
        working-directory: frontend
      - name: Verify embedded frontend bundle is current
        run: git diff --exit-code -- internal/httpapi/web
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - uses: aquasecurity/trivy-action@v0.36.0
        with: {scan-type: fs, scan-ref: ., severity: HIGH,CRITICAL, exit-code: '1'}

  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose files
        run: |
          docker compose config --quiet
          docker compose -f compose.reports.yaml config --quiet
          SLACK_WEBHOOK_URL_FILE=/tmp/slack-webhook docker compose -f compose.yaml -f compose.slack.yaml config --quiet
      - name: Validate OpenAPI contract
        run: npx --yes @redocly/cli@1.34.2 lint openapi.yaml
      - name: Validate Prometheus rules and configuration
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/etc/prometheus:ro" prom/prometheus:v3.2.1 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/etc/prometheus:ro" prom/prometheus:v3.2.1 check rules /etc/prometheus/alerts.yml
      - name: Validate Alertmanager configurations
        run: |
          docker run --rm --entrypoint amtool -v "$PWD/deploy/alertmanager:/etc/alertmanager:ro" prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
          docker run --rm --entrypoint amtool -v "$PWD/deploy/alertmanager:/etc/alertmanager:ro" prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.slack.yml
      - name: Validate Kubernetes and KEDA resources
        run: docker run --rm -v "$PWD/deploy/kubernetes:/manifests:ro" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas /manifests
      - name: Validate rendered deployment overlays
        shell: bash
        run: |
          set -o pipefail
          for overlay in staging production; do
            kubectl kustomize "deploy/overlays/$overlay" | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas
          done
          kubectl kustomize deploy/monitoring | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker, scheduler, migrate, queuectl, loadtest]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: TARGET=${{ matrix.target }}
