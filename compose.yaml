services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: queue
      POSTGRES_PASSWORD: queue
      POSTGRES_DB: queue
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queue -d queue"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      args: { TARGET: migrate }
    environment:
      DATABASE_URL: postgres://queue:queue@postgres:5432/queue?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build:
      context: .
      args: { TARGET: api }
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://queue:queue@postgres:5432/queue?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      S3_ENDPOINT: minio:9000
      S3_PUBLIC_ENDPOINT: localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: forgequeue
      ARTIFACT_MAX_BYTES: 52428800
      ARTIFACT_RETENTION: 168h
    ports: ["${API_PORT:-18080}:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build:
      context: .
      args: { TARGET: worker }
    environment:
      DATABASE_URL: postgres://queue:queue@postgres:5432/queue?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      WORKER_CONCURRENCY: 4
      WORKER_METRICS_ADDR: :9091
      WORKER_DRAIN_TIMEOUT: 45s
      QUEUE_NAMES: jobs.default,jobs.high
      WORKER_CAPABILITIES: echo,sleep
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  scheduler:
    build:
      context: .
      args: { TARGET: scheduler }
    environment:
      DATABASE_URL: postgres://queue:queue@postgres:5432/queue?sslmode=disable
      WORKER_METRICS_ADDR: :9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./deploy/otel/collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4318:4318"]

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    depends_on: [api, worker, scheduler]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["9093:9093"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  postgres-data:
  grafana-data:
  minio-data:
